# Single public entry point for the stack. TLS, if any, is terminated in front of
# this (host nginx on the Pi, or CloudFront later), so everything here is plain HTTP.

# Resolve container names at request time so a restarted service is picked up
# without restarting the gateway.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 20m;   # CV photos and attachments
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection        "";
    proxy_read_timeout 120s;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # REST gateway (Flask)
    location /api/ {
        set $up cv-adapter:5000;
        proxy_pass http://$up;
    }

    # Avatar scenario metadata and videos. Range requests pass through so the
    # browser can seek; buffering is off so large videos stream instead of spooling.
    location /avatar-api/ {
        set $up avatar-db:2010;
        rewrite ^/avatar-api/(.*)$ /api/$1 break;
        proxy_pass http://$up;
        proxy_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # Recruiter UI (React, built with base /manager/)
    location = /manager { return 301 /manager/; }
    location /manager/ {
        set $up frontend-manager:8080;
        proxy_pass http://$up;
    }

    # Admin UI (Express + EJS, mounted with BASE_PATH=/admin)
    location = /admin { return 301 /admin/; }
    location /admin/ {
        set $up frontend-admin:3000;
        proxy_pass http://$up;
    }

    # Candidate UI (Angular)
    location / {
        set $up frontend-user:80;
        proxy_pass http://$up;
    }
}
