server.port=${SERVER_PORT:2015}

# SQLite database file location. Override with DB_PATH (e.g. /data/manager.db in containers).
manager.db-path=${DB_PATH:./manager.db}
# Optional seed database copied to manager.db-path on first start if the target does not exist.
manager.seed-db-path=${SEED_DB_PATH:}
spring.datasource.url=jdbc:sqlite:${manager.db-path}
spring.datasource.driver-class-name=org.sqlite.JDBC
