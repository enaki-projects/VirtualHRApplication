# Static server for the manager SPA. The gateway forwards /manager/... unchanged.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Hashed build assets never change: cache for a year.
    location /manager/assets/ {
        alias /usr/share/nginx/html/manager/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /manager/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /manager/index.html;
    }

    location = / { return 302 /manager/; }
}
