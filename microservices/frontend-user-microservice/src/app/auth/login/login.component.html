<div class="login-page-container">
    <div class="login-component row m-0 justify-content-center">
        <div class="user_card col-3 my-auto">
            <div class="d-flex justify-content-center">
                <div class="brand_logo_container">
                    <img src="../../../assets/logo.png" class="brand_logo" alt="Logo">
                </div>
            </div>
            <div class="d-flex justify-content-center form_container w-75 mx-auto">
                <form [formGroup]='loginForm' (ngSubmit)="login()" autocomplete="off">
                    <div class="input-group mb-3">
                      <app-text-input [formControl]='loginForm.controls["email"]'
                                      [label]='"Email"' [iconName]="faUser"></app-text-input>
                    </div>
                    <div class="input-group mb-3">
                      <app-text-input [formControl]='loginForm.controls["password"]'
                                      [label]='"Password"' [type]='"password"' [iconName]="faKey">
                      </app-text-input>
                    </div>
                    <div class="d-flex justify-content-center mt-3 login_container">
                        <button type="submit" name="button" class="btn login_btn">Login</button>
                    </div>
                </form>
            </div>

            <div class="mt-4">
                <div class="d-flex justify-content-center links">
                  Don't have an account? <a routerLink="/auth/register" class="ml-2 custom-links">Sign Up</a>
                </div>
            </div>

          <div class="mt-1 mb-4">
            <div class="d-flex justify-content-center links">
              Forget Password? <a routerLink="/auth/recover" class="ml-2 custom-links">Recover</a>
            </div>
          </div>

        </div>
    </div>
</div>
