<div class="forget-password-page-container">
  <div class="forget-password-component row m-0 justify-content-center">
    <div class="user_card my-auto col-12 col-md-4 col-lg-3">
      <div class="d-flex justify-content-center">
        <div class="brand_logo_container">
          <img src="../../../assets/logo.png" class="brand_logo" alt="Logo">
        </div>
      </div>
      <div class="d-flex form_container justify-content-center">
        <form *ngIf="!this.token" [formGroup]='recoverForm' (ngSubmit)="sendRequestRecover()" autocomplete="off">
            <div class="input-group mb-3 justify-content-center text-center">
              <app-text-input [formControl]='recoverForm.controls["email"]'
                              [label]='"Email"' [type]='"email"' [iconName]="faUser">
              </app-text-input>
            </div>

          <div class="d-flex justify-content-center mt-3 forgetPassword_container">
            <button [disabled]='!recoverForm.valid'  type="submit" name="forget_password_button" class="btn forget-password_btn">Recover</button>
          </div>

          <div class="d-flex justify-content-center mt-3 forgetPassword_container">
            <a type="button" routerLink="/auth/login" class="btn back_to_login_btn">Back To Login</a>
          </div>
        </form>


        <form *ngIf="this.token" [formGroup]='confirmRecoverForm' (ngSubmit)="confirmRecover()" autocomplete="off">

          <div class="input-group mb-3 justify-content-center text-center">
            <app-text-input [formControl]='confirmRecoverForm.controls["password"]'
                            [label]='"Password"' [type]='"password"' [iconName]="faKey">
            </app-text-input>
          </div>

          <div class="input-group mb-3 justify-content-center text-center">
            <app-text-input [formControl]='confirmRecoverForm.controls["passwordConfirm"]'
                            [label]='"Confirm Password"' [type]='"password"' [iconName]="faKey">
            </app-text-input>
          </div>

          <div class="d-flex justify-content-center mt-3 forgetPassword_container">
            <button [disabled]='!confirmRecoverForm.valid'  type="submit" name="forget_password_button" class="btn forget-password_btn">Confirm</button>
          </div>

          <div class="d-flex justify-content-center mt-3 forgetPassword_container">
            <a type="button" routerLink="/auth/login" class="btn back_to_login_btn">Back To Login</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
