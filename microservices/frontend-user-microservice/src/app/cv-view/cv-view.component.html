<div class="d-flex">
  <div class="row mt-4 w-100 justify-content-between">
    <div class="col-xl-7 col-lg-7 col-md-7 col-sm-10 col-10">
      <app-cv-view-details [currentUser]="currentUser"></app-cv-view-details>
    </div>
    <div class="col-xl-1 col-lg-1 col-md-1 col-sm-2 col-2 text-center mt-2">
      <button class="btn mt-1 mb-2 w-100" [ngClass]="moreOptions ? 'btn-danger' : 'btn-success'" type="button" (click)="enableMoreOptions()">
        <fa-icon *ngIf="!moreOptions" class="" [icon]="faPlus"></fa-icon>
        <fa-icon *ngIf="moreOptions" class="" [icon]="faMinus"></fa-icon>
        {{!moreOptions? 'More Options': 'Less Options'}}
      </button>
    </div>

    <div *ngIf="!moreOptions" class="col-xl-4 col-lg-4 col-md-4 col-sm-12 col-12 mt-2">
      <app-vjs-player></app-vjs-player>
    </div>
    <div *ngIf="moreOptions" class="col-xl-4 col-lg-4 col-md-4 col-sm-12 col-12 mt-2">
      <div class="card">
        <div class="card card-header">
          <h3 class="text-center">CV Settings</h3>
        </div>
        <div class="card card-body">
          <button class="btn mt-1 mb-2 btn-success w-100"  type="button" value="CAPTURE" (click)="captureScreen(true)">
            <fa-icon class="" [icon]="faEye"></fa-icon>
            View CV
          </button>
          <button class="btn mt-2 btn-info w-100" type="button" value="CAPTURE" (click)="captureScreen(false)">
            <fa-icon class="" [icon]="faCloud"></fa-icon>
            Save CV
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
