<div class="row mt-3 ">
  <div class="col-md-4">
    <h3>Add Photos</h3>
    <div ng2FileDrop
         [ngClass]="{'nv-file-over': hasBaseDropzoneOver}"
         (fileOver)="fileOverBase($event)"
         [uploader]="uploader"
         class="card bg-faded p-3 text-center mb-3 my-drop-zone">
      <fa-icon [icon]="faUpload"></fa-icon>
      Drop a PNG photo here
    </div>
    <div>
      <label for="file-upload" class="custom-file-upload">
        <fa-icon [icon]="faCloudUploadAlt"></fa-icon> Choose a PNG Image
      </label>
      <input id="file-upload" type="file" ng2FileSelect [uploader]="uploader"/>
    </div>
  </div>

  <div class="col-md-8" style="margin-bottom: 40px" *ngIf="uploader?.queue?.length" >
    <h3>Upload queue</h3>
    <p>Queue length: {{ uploader?.queue?.length }}</p>

    <table class="table">
      <thead>
      <tr>
        <th width="50%">Name</th>
        <th>Size</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let item of uploader.queue">
        <td><strong>{{ item?.file?.name }}</strong></td>
        <td *ngIf="uploader.options.isHTML5" nowrap>{{ item?.file?.size/1024/1024 | number:'.2' }} MB</td>
      </tr>
      </tbody>
    </table>

    <div>
      <div>
        Queue progress:
        <div class="progress" style="">
          <div class="progress-bar" role="progressbar" [ngStyle]="{ 'width': uploader.progress + '%' }"></div>
        </div>
      </div>
      <button type="button" class="btn btn-success btn-xs"
              (click)="uploader.uploadAll()" [disabled]="!uploader.getNotUploadedItems().length">
        <fa-icon [icon]="faUpload"></fa-icon> Upload
      </button>
      <button type="button" class="btn btn-warning btn-xs"
              (click)="uploader.cancelAll()" [disabled]="!uploader.isUploading">
        <fa-icon [icon]="faBan"></fa-icon> Cancel
      </button>
      <button type="button" class="btn btn-danger btn-xs"
              (click)="uploader.clearQueue()" [disabled]="!uploader.queue.length">
        <fa-icon [icon]="faTrash"></fa-icon> Remove
      </button>
    </div>
  </div>
</div>
