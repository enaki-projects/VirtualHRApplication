<div class="flex m-2">
  <div class="text-right">
    <button class="btn btn-success mb-2 mt-2" (click)="openAddModal()">Add A Location</button>
  </div>

  <table class="table table-striped text-center">
    <thead>
    <tr>
      <th class="align-middle" scope="col">#</th>
      <th class="align-middle" scope="col">Type</th>
      <th class="align-middle" scope="col">Country</th>
      <th class="align-middle" scope="col">Region</th>
      <th class="align-middle" scope="col">City</th>
      <th class="align-middle" scope="col">Address</th>
      <th class="align-middle" scope="col">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let location of locations; index as i">
      <th class="align-middle" scope="row">{{ i + 1 }}</th>
      <td class="align-middle">
        <fa-icon *ngIf="(location.type | lowercase) === 'home'" [icon]="faHome"></fa-icon>
        <fa-icon *ngIf="(location.type | lowercase) === 'work'" [icon]="faBriefcase"></fa-icon>
        <fa-icon *ngIf="(location.type | lowercase) === 'other'" [icon]="faBuilding"></fa-icon>
        {{location.type}}</td>
      <td class="align-middle"><span class="flag-icon flag-icon-{{location.city.region.country.iso2 | lowercase}}"></span> {{location.city.region.country.countryName}}</td>
      <td class="align-middle">{{location.city.region.regionName}}</td>
      <td class="align-middle">{{location.city.cityName}}</td>
      <td class="align-middle">{{location.address}}</td>
      <td class="align-middle">
        <button class="btn btn-outline-info mr-3" (click)="openUpdateModal(location)"><fa-icon [icon]="faPen"></fa-icon></button>
        <button class="btn btn-outline-danger action" (click)="deleteLocation(location.locationId)"><fa-icon [icon]="faTrash"></fa-icon></button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
