<div class="flex m-2">
  <div class="text-right">
    <button class="btn btn-success mb-2 mt-2" (click)="openAddModal()">Add A Project</button>
  </div>

  <table class="table table-striped text-center">
    <thead>
    <tr>
      <th class="align-middle" scope="col">#</th>
      <th class="align-middle" scope="col">Name</th>
      <th class="align-middle" scope="col">From Date</th>
      <th class="align-middle" scope="col">To Date</th>
      <th class="align-middle" scope="col">See Project</th>
      <th class="align-middle" scope="col">Description</th>
      <th class="align-middle" scope="col">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let project of projects; index as i">
      <th class="align-middle" scope="row">{{ i + 1 }}</th>

      <td class="align-middle">{{project.name}}</td>
      <td class="align-middle">{{project.fromDate}}</td>
      <td class="align-middle">{{project.toDate || 'Present'}}</td>
      <td class="align-middle">
        <a *ngIf="project.url" href="{{project.url}}"><fa-icon [icon]="faEye"></fa-icon></a>
        <fa-icon *ngIf="project.url == null || project.url.length == 0" [icon]="faEyeSlash"></fa-icon>
      </td>

      <td class="align-middle">{{project.description}}</td>
      <td class="align-middle">
        <button class="btn btn-outline-info mr-3" (click)="openUpdateModal(project)"><fa-icon [icon]="faPen"></fa-icon></button>
        <button class="btn btn-outline-danger action" (click)="deleteProject(project.projectId)"><fa-icon [icon]="faTrash"></fa-icon></button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
