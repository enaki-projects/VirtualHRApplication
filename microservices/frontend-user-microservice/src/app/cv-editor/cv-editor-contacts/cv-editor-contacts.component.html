<div class="flex m-2">
  <div class="text-right">
    <button class="btn btn-success mb-2 mt-2" (click)="openAddModal()">Add Phone Number</button>
  </div>

  <table class="table table-striped text-center">
    <thead>
    <tr>
      <th class="align-middle" scope="col">#</th>
      <th class="align-middle" scope="col">Country</th>
      <th class="align-middle" scope="col">Code</th>
      <th class="align-middle" scope="col">Phone Number</th>
      <th class="align-middle" scope="col">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let phoneNumber of phoneNumbers; index as i">
      <th class="align-middle" scope="row">{{ i + 1 }}</th>
      <td class="align-middle">
        <span class="flag-icon flag-icon-{{phoneNumber.country.iso2 | lowercase}}"></span>
        {{ phoneNumber.country.countryName }}
      </td>
      <td class="align-middle">+{{ phoneNumber.country.phoneCode }}</td>
      <td class="align-middle">{{phoneNumber.number}}</td>
      <td class="align-middle">
        <button class="btn btn-outline-info mr-3" (click)="openUpdateModal(phoneNumber)"><fa-icon [icon]="faPen"></fa-icon></button>
        <button class="btn btn-outline-danger action" (click)="deleteNumber(phoneNumber.phoneNumberId)"><fa-icon [icon]="faTrash"></fa-icon></button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
