<div class="flex m-2">
  <div class="text-right">
    <button class="btn btn-success mb-2 mt-2" (click)="openAddModal()">Add A Known Language</button>
  </div>

  <table class="table table-striped text-center">
    <thead>
    <tr>
      <th class="align-middle" scope="col">#</th>
      <th class="align-middle" scope="col">Language</th>
      <th class="align-middle" scope="col">Listening</th>
      <th class="align-middle" scope="col">Reading</th>
      <th class="align-middle" scope="col">Spoken Interaction</th>
      <th class="align-middle" scope="col">Spoken Production</th>
      <th class="align-middle" scope="col">Writing</th>
      <th class="align-middle" scope="col">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let userLanguage of userLanguages; index as i">
      <th class="align-middle" scope="row">{{ i + 1 }}</th>
      <td class="align-middle">{{userLanguage.language.name}}</td>
      <td class="align-middle">{{userLanguage.listening}}</td>
      <td class="align-middle">{{userLanguage.reading}}</td>
      <td class="align-middle">{{userLanguage.spokenInteraction}}</td>
      <td class="align-middle">{{userLanguage.spokenProduction}}</td>
      <td class="align-middle">{{userLanguage.writing}}</td>
      <td class="align-middle">
        <button class="btn btn-outline-info mr-3" (click)="openUpdateModal(userLanguage)"><fa-icon [icon]="faPen"></fa-icon></button>
        <button class="btn btn-outline-danger action" (click)="deleteLanguage(userLanguage.userLanguageId)"><fa-icon [icon]="faTrash"></fa-icon></button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
