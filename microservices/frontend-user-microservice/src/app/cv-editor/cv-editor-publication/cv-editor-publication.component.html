<div class="flex m-2">
  <div class="text-right">
    <button class="btn btn-success mb-2 mt-2" (click)="openAddModal()">Add A Publication</button>
  </div>

  <table class="table table-striped text-center">
    <thead>
    <tr>
      <th class="align-middle" scope="col">#</th>
      <th class="align-middle" scope="col">Title</th>
      <th class="align-middle" scope="col">From Date</th>
      <th class="align-middle" scope="col">See Project</th>
      <th class="align-middle" scope="col">Description</th>
      <th class="align-middle w-10" scope="col">Reference</th>
      <th class="align-middle" scope="col">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let publication of publications; index as i">
      <th class="align-middle" scope="row">{{ i + 1 }}</th>
      <td class="align-middle">{{publication.title}}</td>
      <td class="align-middle">{{publication.year}}</td>
      <td class="align-middle">
        <a *ngIf="publication.url" href="{{publication.url}}"><fa-icon [icon]="faEye"></fa-icon></a>
        <fa-icon *ngIf="publication.url == null || publication.url.length == 0" [icon]="faEyeSlash"></fa-icon>
      </td>
      <td class="align-middle">{{publication.description || 'No Description'}}</td>
      <td class="align-middle">{{publication.reference || 'No Reference'}}</td>
      <td class="align-middle">
        <button class="btn btn-outline-info mr-3" (click)="openUpdateModal(publication)"><fa-icon [icon]="faPen"></fa-icon></button>
        <button class="btn btn-outline-danger action" (click)="deletePublication(publication.publicationId)"><fa-icon [icon]="faTrash"></fa-icon></button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
