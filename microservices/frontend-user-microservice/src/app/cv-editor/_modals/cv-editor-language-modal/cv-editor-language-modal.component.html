<div class="modal-header bg-light">
  <h4 class="modal-title">{{addAction ? 'Add A ': 'Update The '}} Known Language!</h4>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.hide()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="d-flex justify-content-center form_container">
    <form *ngIf="languageForm" [formGroup]='languageForm' autocomplete="off">

      <div class="row">
        <div class="input-group mb-3 col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
          <div class="input-group-append">
            <span class="input-group-text input-group-text-input"><fa-icon [icon]="faGlobe"></fa-icon></span>
          </div>
          <select (change)="onChange($event.target.value)"
                  [class.is-invalid]='languageForm.get("languageId").errors && languageForm.get("languageId").touched'
                  formControlName="languageId" class="form-control input_user" [value]="selectedLanguage?.languageId"
                  [formControl]="languageForm.controls['languageId']">

            <option *ngFor="let language of languages"
                    [value]="language.languageId"
            >
              {{language.name}}
            </option>
          </select>
        </div>
      </div>

      <div class="row mb-1">
          <app-select-input class = "col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12" [formControl]='languageForm.controls["listening"]'
                            [textToDisplay]='"Listening"' [label]='"listening"' [type]='"text"' [defaultValue]="userLanguage?.listening" [options]="languageLevels">
          </app-select-input>
      </div>
      <div class="row mb-1">
        <app-select-input class = "col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12" [formControl]='languageForm.controls["reading"]'
                          [textToDisplay]='"Reading"' [label]='"reading"' [type]='"text"' [defaultValue]="userLanguage?.reading" [options]="languageLevels">
        </app-select-input>
      </div>
      <div class="row mb-1">
        <app-select-input class = "col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12" [formControl]='languageForm.controls["spokenInteraction"]'
                          [textToDisplay]='"Spoken Interaction"' [label]='"spokenInteraction"' [type]='"text"' [defaultValue]="userLanguage?.spokenInteraction" [options]="languageLevels">
        </app-select-input>
      </div>
      <div class="row mb-1">
        <app-select-input class = "col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12" [formControl]='languageForm.controls["spokenProduction"]'
                          [textToDisplay]='"Spoken Production"' [label]='"spokenProduction"' [type]='"text"' [defaultValue]="userLanguage?.spokenProduction" [options]="languageLevels">
        </app-select-input>
      </div>
      <div class="row ">
        <app-select-input class = "col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12" [formControl]='languageForm.controls["writing"]'
                          [textToDisplay]='"Writing"' [label]='"writing"' [type]='"text"' [defaultValue]="userLanguage?.writing" [options]="languageLevels">
        </app-select-input>
      </div>
    </form>
  </div>

</div>
<div class="modal-footer bg-light">
  <button [disabled]='!languageForm.valid' *ngIf="addAction" type="button" class="btn btn-success"
          (click)="addLanguage()">Add
  </button>
  <button [disabled]='!languageForm.valid' *ngIf="updateAction" type="button" class="btn btn-info"
          (click)="updateLanguage()">Update
  </button>
  <button type="button" class="btn btn-dark" (click)="activeModal.hide()">Close</button>
</div>
