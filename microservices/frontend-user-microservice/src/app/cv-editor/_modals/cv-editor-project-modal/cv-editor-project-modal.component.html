<div class="modal-header bg-light">
  <h4 class="modal-title">{{addAction ? 'Add A ': 'Update The '}} Project!</h4>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.hide()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="d-flex justify-content-center form_container">
    <form *ngIf="projectForm" [formGroup]='projectForm' (ngSubmit)="addProject()" autocomplete="off">
      <div class="row">
        <div class="input-group mb-3 col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
          <div class="input-group mb-3">
            <span class="input-group-text input-group-text-area col-12 input-group-text-cst text-light">Name: </span>
            <textarea [formControl]='projectForm.controls["name"]' class="form-control"
                      aria-label="With textarea"></textarea>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="input-group col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
          <app-date-input [formControl]='projectForm.controls["fromDate"]' [maxDate]="toDateMaxValue()" [label]='"From Date"'></app-date-input>
        </div>
        <div  class="input-group col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
          <app-date-input [isDisabled]="toPresent" [formControl]='projectForm.controls["toDate"]' [minDate]="projectForm.value.fromDate" [label]='toPresent? "To Present": "To Date" '></app-date-input>
        </div>

      </div>
      <div class="row">
        <div class="input-group offset-md-6 offset-lg-6 offset-xl-6 mb-3 col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
          <div class="form-check mt-1">
            <input class="form-check-input" type="checkbox" [checked]="toPresent" (change)="onToPresentChange($event)">
            <label class="form-check-label">
              To Present
            </label>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="input-group mb-3 col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
          <div class="input-group mb-3">
            <span class="input-group-text input-group-text-area col-12 input-group-text-cst text-light">Url: </span>
            <textarea type="url" [formControl]='projectForm.controls["url"]' class="form-control"
                      aria-label="With textarea"></textarea>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="input-group mb-3 col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
          <div class="input-group mb-3">
            <span class="input-group-text input-group-text-area col-12 input-group-text-cst text-light">Description: </span>
            <textarea [formControl]='projectForm.controls["description"]' class="form-control"
                      aria-label="With textarea"></textarea>
          </div>
        </div>
      </div>

    </form>
  </div>

</div>
<div class="modal-footer bg-light">
  <button [disabled]='!projectForm.valid' *ngIf="addAction" type="button" class="btn btn-success"
          (click)="addProject()">Add
  </button>
  <button [disabled]='!projectForm.valid' *ngIf="updateAction" type="button" class="btn btn-info"
          (click)="updateProject()">Update
  </button>
  <button type="button" class="btn btn-dark" (click)="activeModal.hide()">Close</button>
</div>
