<div class="modal-header bg-light">
  <h4 class="modal-title">{{addAction ? 'Add A ': 'Update The '}} Professional Experience!</h4>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.hide()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="d-flex justify-content-center form_container">
    <form *ngIf="professionalExperienceForm" [formGroup]='professionalExperienceForm'
          (ngSubmit)="addProfessionalExperience()" autocomplete="off">

      <div class="row">
        <div class="input-group mb-3 col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
          <div class="input-group-append">
            <span class="input-group-text input-group-text-input input-group-text-cst"><fa-icon [icon]="faFlag"></fa-icon></span>
          </div>
          <div class="input-group-append">
            <div class="input-group-text" >
              <span class="flag-icon flag-icon-{{this.selectedCountry?.iso2 | lowercase}}"></span>
            </div>
          </div>
          <select (change)="onCountryChange($event.target.value)"
                  class="form-control input_user"
          >
            <option *ngFor="let country of countries"
                    [value]="country.countryId" [selected]="country.countryId === selectedCountry?.countryId"
            >
              {{country.countryName}}
            </option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="input-group mb-3 col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
          <div class="input-group-append w-35">
            <div class="input-group-text input-group-text-cst w-100 justify-content-center">
              <span class="text-primary text-light">Region</span>
            </div>
          </div>
          <select (change)="onRegionChange($event.target.value)"
                  class="form-control input_user"
          >

            <option *ngFor="let region of regions"
                    [value]="region.regionId" [selected]="region.regionId === selectedRegion?.regionId"
            >
              {{region.regionName}}
            </option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="input-group mb-3 col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
          <div class="input-group-append w-35">
            <div class="input-group-text input-group-text-cst w-100 justify-content-center">
              <span class="text-primary text-light">City</span>
            </div>
          </div>
          <select
            (change)="onCityChange($event.target.value)" [class.is-invalid]='professionalExperienceForm.get("cityId").touched && professionalExperienceForm.get("cityId").invalid'
            formControlName="cityId" class="form-control input_user"
            [formControl]="professionalExperienceForm.controls['cityId']">

            <option *ngFor="let city of cities"
                    [value]="city.cityId" [selected]="city.cityId === selectedCity?.cityId"
            >
              {{city.cityName}}
            </option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="input-group mb-3 col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
          <div class="input-group-text input-group-text-cst text-light">Organisation: </div>
          <input [formControl]='professionalExperienceForm.controls["organisationName"]'
                 [typeahead]="dataSource"
                 [typeaheadAsync]="true"
                 [typeaheadOptionsLimit]="10"
                 (typeaheadOnSelect)="typeaheadOnSelect($event)"
                 typeaheadOptionField="organisationName"
                 (typeaheadLoading)="changeTypeaheadLoading($event)"
                 placeholder="Companies"
                 class="form-control"></div>
      </div>

      <div class="row">
        <div class="input-group col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
          <app-date-input [formControl]='professionalExperienceForm.controls["fromDate"]' [maxDate]="toDateMaxValue()"
                          [label]='"From Date"'></app-date-input>
        </div>
        <div class="input-group col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
          <app-date-input [isDisabled]="toPresent" [formControl]='professionalExperienceForm.controls["toDate"]'
                          [minDate]="professionalExperienceForm.value.fromDate"
                          [label]='toPresent? "To Present": "To Date" '></app-date-input>
        </div>

      </div>

      <div class="row">
        <div class="input-group offset-md-6 offset-lg-6 offset-xl-6 mb-3 col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
          <div class="form-check mt-1">
            <input class="form-check-input" type="checkbox" [checked]="toPresent" (change)="onToPresentChange($event)">
            <label class="form-check-label">
              To Present
            </label>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="input-group mb-3 col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
          <div class="input-group mb-3">
            <span
              class="input-group-text input-group-text-area col-12 input-group-text-cst text-light">Job Name: </span>
            <textarea [formControl]='professionalExperienceForm.controls["jobName"]' class="form-control"
                      aria-label="With textarea"></textarea>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="input-group mb-3 col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
          <div class="input-group mb-3">
            <span
              class="input-group-text input-group-text-area col-12 input-group-text-cst text-light">Description: </span>
            <textarea [formControl]='professionalExperienceForm.controls["description"]' class="form-control"
                      aria-label="With textarea"></textarea>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
<div class="modal-footer bg-light">
  <button [disabled]='!professionalExperienceForm.valid' *ngIf="addAction" type="button"
          class="btn btn-success"
          (click)="addProfessionalExperience()">Add
  </button>
  <button [disabled]='!professionalExperienceForm.valid' *ngIf="updateAction" type="button"
          class="btn btn-info"
          (click)="updateProfessionalExperience()">Update
  </button>
  <button type="button" class="btn btn-dark" (click)="activeModal.hide()">Close</button>
</div>
