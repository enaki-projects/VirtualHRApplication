# Datasource: path comes from DB_PATH env (default ./cv.db). Created + seeded on startup if missing/empty.
spring.datasource.url=jdbc:sqlite:${DB_PATH:./cv.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# We seed the schema/data ourselves (DatabaseInitializer), so disable Spring's auto script init.
spring.sql.init.mode=never

server.port=${SERVER_PORT:2011}

# Base URL this service advertises for building absolute resource links (e.g. image URLs).
# Supplied via the CV_DB_MICROSERVICE env var (relaxed-binding -> property cv_db_microservice).
# Intentionally NOT defaulted here: when unset ServerEnvUtils falls back to the local host address,
# which is the original behaviour. The stale herokuapp URL has been removed.
