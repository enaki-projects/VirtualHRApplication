version: "3.6"
volumes:
  shared-workspace:
    name: "hadoop-distributed-file-system"
    driver: local
services:
  spark-master:
    image: spark-master
    container_name: spark-master
    ports:
      - "2020:8080"
      - "7077:7077"
    networks:
      my-net:
        ipv4_address: 172.18.0.5
    volumes:
      - shared-workspace:/opt/workspace
  spark-worker-1:
    image: spark-worker
    container_name: spark-worker-1
    environment:
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=512m
    ports:
      - "2021:8081"
    networks:
      my-net:
        ipv4_address: 172.18.0.6
    volumes:
      - shared-workspace:/opt/workspace
    depends_on:
      - spark-master
  spark-worker-2:
    image: spark-worker
    container_name: spark-worker-2
    environment:
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=512m
    ports:
      - "2022:8081"
    networks:
      my-net:
        ipv4_address: 172.18.0.7
    volumes:
      - shared-workspace:/opt/workspace
    depends_on:
      - spark-master
networks:
    my-net:
        external: true